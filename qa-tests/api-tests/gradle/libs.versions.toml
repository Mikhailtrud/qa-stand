[versions]
junit = "5.13.4"
rest-assured = "5.5.6"
jackson = "2.20.0"
assertj = "3.27.6"
allure = "2.29.1"

[libraries]

# JUnit
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# REST Assured
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }

# Jackson
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# AssertJ
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Allure
allure-junit5 = { module = "io.qameta.allure:allure-junit5", version.ref = "allure" }
allure-rest-assured = { module = "io.qameta.allure:allure-rest-assured", version.ref = "allure" }

[bundles]
