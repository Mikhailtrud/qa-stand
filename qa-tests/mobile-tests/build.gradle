plugins {
    id 'java'
}

group = 'com.qastand.mobile'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'io.appium:java-client:10.1.1'
    testImplementation 'org.assertj:assertj-core:3.27.6'
    testImplementation 'io.qameta.allure:allure-junit5:2.35.4'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
}

test {
    useJUnitPlatform()
    systemProperty 'mobile.tests.projectDir', projectDir.absolutePath
    systemProperty 'allure.results.directory', layout.buildDirectory.dir('allure-results').get().asFile
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
